<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'/>
    <title>L-T</title>
    <script src="../common/libs.js"></script>
    <script src="../common/engine.js"></script>
    <script src="lt.js"></script>
    <script>
      window.addEventListener('load', function() {
        var E = ENGINE.create('your_canvas', { dist: 8, targetY: 1.4, theta: 0.6, phi: 0.2 });
        E.spawn(CHARACTERS.LT);
        E.start();
      });
    </script>
  </head>
  <body style='margin: 0; overflow: hidden'>
    <canvas id='your_canvas'
            style='position: absolute; background-color: black;'></canvas>
  </body>
</html>
